[project]
name = "darzi"
version = "0.2.1"
description = "Turns a job post into a checked, approved résumé and cover letter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kailash Thakur" }]
requires-python = ">=3.12"
dependencies = [
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
]

[project.scripts]
facts = "darzi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darzi"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]
# Markdown files are documents, not code. Do not format their code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Parsed YAML has no static types; these reports only add noise on `Any` data.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "renderer: needs a Resume Matcher test instance (DARZI_RENDER_TEST names its TOML file)",
    "libreoffice: needs LibreOffice at one of the paths in darzi.render.pages",
]
